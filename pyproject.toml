[build-system]
# 1.27 is the first release that emits a PEP 639 License-Expression. Below it
# the build silently produces Metadata 2.3 with a free-text License field, which
# the publish workflow's license check then reports as "no license at all".
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "galaxy-fsspec"
version = "0.1.0"
description = "An fsspec filesystem for Galaxy histories, datasets, and collections."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "galaxy-fsspec contributors" }]
keywords = ["galaxy", "fsspec", "bioblend", "filesystem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # 2024.9.0 is the first release whose AbstractFileSystem.to_dict takes
    # include_password, which the credential redaction builds on.
    "fsspec>=2024.9.0",
    # 1.2.0 is the first release whose GalaxyInstance.base_url strips a
    # trailing slash. Below it every hand-built download URL doubles the
    # separator and every read 404s.
    "bioblend>=1.2.0",
    "requests>=2.31",
]

[project.entry-points."fsspec.specs"]
galaxy = "galaxy_fsspec.fs:GalaxyFileSystem"

[project.urls]
Homepage = "https://github.com/bgruening/galaxy-fsspec"
Issues = "https://github.com/bgruening/galaxy-fsspec/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # tomllib arrived in 3.11, and 3.10 is the version this package promises to
    # support. Without this the test pinning the version against pyproject.toml
    # skips on the one Python most likely to break.
    "tomli>=2.0; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/galaxy_fsspec"]

[tool.hatch.build.targets.sdist]
# Keep the tests, so the archive can be verified on its own. Leave out the
# things that only make sense in a git checkout.
include = [
    "src",
    "tests",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src/galaxy_fsspec"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Coverage is a CI concern, not a property of the test suite: baking --cov into
# addopts makes the shipped tests unrunnable without pytest-cov, and makes every
# later pytest invocation rewrite .coverage.
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that hit a live Galaxy instance (require GALAXY_USER_API_KEY)",
]
filterwarnings = ["error"]

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deny by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-unit:
    name: Lint & unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The justfile stays for local development; CI runs the underlying
      # commands directly so release correctness never depends on a task runner.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src

      - name: Unit tests
        run: uv run pytest -m "not integration" --cov=galaxy_fsspec --cov-report=term-missing

      # Catches import/collection errors in the live suite without a Galaxy key.
      - name: Collect integration tests
        run: uv run pytest --collect-only -m "integration" -q

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  integration:
    name: Integration tests (live Galaxy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-unit
    # Never expose the live-test credential to a pull_request event, and require
    # an explicit non-secret opt-in. `vars.*` is empty unless a maintainer sets it.
    if: >-
      github.event_name != 'pull_request'
      && vars.RUN_LIVE_INTEGRATION_TESTS == 'true'
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
      GALAXY_URL: ${{ vars.GALAXY_URL || 'https://usegalaxy.org' }}
      GALAXY_USER_API_KEY: ${{ secrets.GALAXY_USER_API_KEY }}
    steps:
      # Fail loudly rather than silently skipping: an enabled live suite that
      # quietly does nothing is worse than no live suite at all.
      - name: Require the live-test credential
        run: |
          if [ -z "${GALAXY_USER_API_KEY}" ]; then
            echo "::error::RUN_LIVE_INTEGRATION_TESTS is 'true' but the" \
                 "GALAXY_USER_API_KEY secret is not set for this repository."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Integration tests
        run: uv run pytest -m "integration"
